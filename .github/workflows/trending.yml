name: Update trending

on:
  schedule:
    # Mondays at 00:20 UTC, once the previous Sunday has fully closed.
    - cron: '20 0 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-trending
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Rank last week's share visits
        run: node scripts/update-trending.mjs
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_D1_READ_TOKEN }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}

      - name: Commit if trending changed
        run: |
          if git diff --quiet -- src/data/trending.json; then
            echo "Trending unchanged, nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add src/data/trending.json
          git commit -m "Update trending for week of $(node -p "require('./src/data/trending.json').week_of")"
          git push